<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesantren Al-Ihsan (Demo) — Situs Portofolio</title>
    <meta
      name="description"
      content="Situs demo portofolio untuk pesantren fiktif Pesantren Al-Ihsan: profil, program SMP, SMA, dan tahfidz, berita, galeri, serta pendaftaran online."
    />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="color-scheme" content="light dark" />
    <!-- Pasang tema tersimpan SEBELUM CSS dimuat, supaya tidak ada kedipan putih
         saat pengguna memilih mode gelap. Sinkron dengan src/hooks/useTema.js. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tema');
          if (t === 'terang') document.documentElement.dataset.theme = 'light';
          else if (t === 'gelap') document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Pesantren Al-Ihsan (Demo)" />
    <meta property="og:title" content="Pesantren Al-Ihsan (Demo)" />
    <meta
      property="og:description"
      content="Situs demo portofolio untuk pesantren fiktif: profil, program, berita, galeri, dan pendaftaran online."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Font Google dimuat TANPA memblokir render: media="print" membuat peramban mengunduhnya
      sejak awal tetapi tidak menunggu; src/main.jsx lalu mengganti media ke "all".
      (Pola onload="this.media='all'" sengaja tidak dipakai: atribut event inline dilarang CSP.)
      Hanya bobot yang dipakai. Lato tidak punya 500/600.
    -->
    <link
      rel="stylesheet"
      media="print"
      data-font
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Open+Sans:wght@400;600&family=Playfair+Display:wght@600;700&display=swap"
    />
    <!-- Amiri: subset 29 karakter Arab yang dipakai (basmalah + ayat), bobot 400 saja.
         Bila teks Arab di situs ditambah, perbarui &text= (lihat CLAUDE.md). -->
    <link
      rel="stylesheet"
      media="print"
      data-font
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400&text=%D8%A8%D9%90%D8%B3%D9%92%D9%85%D9%B1%D9%84%D9%8E%D9%91%D9%87%D8%B1%D8%AD%D9%B0%D9%86%D9%8A%D9%81%D8%B9%D9%8F%D8%B0%D8%A1%D8%A7%D9%88%DB%9F%D9%83%D8%A3%D8%AA%D8%AF%D8%AC%D9%8D&display=swap"
    />
    <!-- Cinzel hanya untuk logo: subset berisi huruf "PESANTREN AL-IHSAN (DEMO)" saja. -->
    <link
      rel="stylesheet"
      media="print"
      data-font
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&text=PESANTRLIHDMO()-%20&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
